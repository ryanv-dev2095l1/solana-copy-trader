[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solana-copy-trader"
version = "0.2.0"
description = "async daemon tracking solana wallets and mirroring dex swaps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "solana>=0.34.0",
    "solders>=0.21.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "rich>=13.7.0",
    "base58>=2.1.1",
]

[project.scripts]
copytrader = "solana_copy_trader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
